<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Scratch — хаос</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b12; }
  canvas { display: block; cursor: crosshair; }
  #hud {
    position: fixed; left: 14px; bottom: 14px;
    font: 13px/1.5 ui-monospace, Consolas, monospace;
    color: #7d7d96; user-select: none; pointer-events: none;
  }
  #hud b { color: #ff5fa2; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">клик / движение = заебись · <b>R</b> сброс · <b>пробел</b> пауза</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, parts = [], paused = false;

const COLORS = ['#ff5fa2', '#5fd7ff', '#ffe55f', '#8bff5f', '#c08bff', '#ff8b5f'];
const rnd = (a, b) => a + Math.random() * (b - a);

function resize() {
  W = cv.width = innerWidth;
  H = cv.height = innerHeight;
}
addEventListener('resize', resize);
resize();

class Part {
  constructor(x, y, burst = false) {
    this.x = x; this.y = y;
    const a = Math.random() * Math.PI * 2;
    const s = burst ? rnd(1, 7) : rnd(0.3, 2);
    this.vx = Math.cos(a) * s;
    this.vy = Math.sin(a) * s;
    this.life = 1;
    this.decay = rnd(0.004, 0.014);
    this.r = rnd(1, burst ? 5 : 3);
    this.color = COLORS[(Math.random() * COLORS.length) | 0];
    this.spin = rnd(-0.2, 0.2);
    this.rot = Math.random() * 6.28;
    this.kind = Math.random() < 0.25 ? 'sq' : 'dot';
  }
  step() {
    this.rot += this.spin;
    this.vx *= 0.985;
    this.vy = this.vy * 0.985 + 0.03;          // лёгкая гравитация
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < 0 || this.x > W) this.vx *= -0.9;
    this.x = Math.max(0, Math.min(W, this.x));
    this.life -= this.decay;
  }
  draw() {
    ctx.globalAlpha = Math.max(0, this.life) * 0.95;
    ctx.fillStyle = this.color;
    if (this.kind === 'sq') {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot);
      ctx.fillRect(-this.r, -this.r, this.r * 2, this.r * 2);
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, 6.283);
      ctx.fill();
    }
  }
}

function burst(x, y, n = 40) {
  for (let i = 0; i < n; i++) parts.push(new Part(x, y, true));
}
function sprinkle(x, y) {
  for (let i = 0; i < 2; i++) parts.push(new Part(x + rnd(-6, 6), y + rnd(-6, 6)));
}

let mx = -999, my = -999;
addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; sprinkle(mx, my); });
addEventListener('pointerdown', e => burst(e.clientX, e.clientY, 60));
addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К') parts = [];
  if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
});

function frame() {
  // шлейф вместо полной очистки — получается дымка
  ctx.globalAlpha = 1;
  ctx.fillStyle = paused ? 'rgba(11,11,18,0.02)' : 'rgba(11,11,18,0.12)';
  ctx.fillRect(0, 0, W, H);

  if (mx > 0 && !paused && Math.random() < 0.5) sprinkle(mx, my);

  parts = parts.filter(p => p.life > 0 && p.y < H + 50);
  for (const p of parts) {
    if (!paused) p.step();
    p.draw();
  }
  if (parts.length > 2500) parts.splice(0, parts.length - 2500);

  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

// стартовый залп
burst(W / 2, H / 2, 120);
frame();
</script>
</body>
</html>
