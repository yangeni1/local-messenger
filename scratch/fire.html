<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ПОЖАР В КОТО-РЕДАКТОРЕ 🔥</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #160a0a; }
  canvas { display: block; }
  #msg {
    position: fixed; inset: auto 0 0 0; padding: 18px; text-align: center;
    font: 700 20px/1.4 "Trebuchet MS", system-ui, sans-serif;
    color: #ffd166; text-shadow: 0 0 18px #ff4d00;
    background: linear-gradient(transparent, rgba(30,0,0,.85));
    user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg">Скратч запустился без тормозов — поэтому он в огне. Клик = ещё огня · R = сброс</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H;
const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
addEventListener('resize', resize); resize();

const EMBERS = [], SMOKE = [], FUEL = [];
const rnd = (a, b) => a + Math.random() * (b - a);

// оранжевый кот-спрайт (пиксельно), чтобы было понятно, кто горит
const CAT = [
  '...........',
  '..X.....X..',
  '.XXX...XXX.',
  '.XXXX.XXXX.',
  '.XXWXXXWXX.',
  '.XXXKKKXXX.',
  '..XXXXXXX..',
  '.XXXXXXXXX.',
];
const SPRITE = CAT.map(r => r.split(''));
let catX, catY;

function reset() {
  EMBERS.length = SMOKE.length = FUEL.length = 0;
  catX = W * 0.5; catY = H * 0.62;
}
reset();

function ember(x, y, big = false) {
  FUEL.push({ x, y, vx: rnd(-1.5, 1.5) * (big ? 2.2 : 1), vy: rnd(-2.2, -0.6) * (big ? 1.4 : 1), life: 1, decay: rnd(0.012, 0.035), r: rnd(2, big ? 7 : 4.5), hue: rnd(10, 45) });
}
function smoke(x, y) {
  SMOKE.push({ x, y, vx: rnd(-0.6, 0.6), vy: rnd(-1.4, -0.5), life: 1, decay: rnd(0.002, 0.006), r: rnd(8, 26), rot: rnd(0, 6.28) });
}

addEventListener('pointerdown', e => {
  for (let i = 0; i < 80; i++) { const a = Math.random() * 6.28, s = rnd(1, 9); const p = { x: e.clientX, y: e.clientY }; EMBERS.push({ x: p.x, y: p.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 1, decay: rnd(0.006, 0.02), r: rnd(1, 4), hue: rnd(8, 50) }); }
});
addEventListener('keydown', e => { if (/^[rRкК]$/.test(e.key)) reset(); });

function drawCat(t) {
  const px = Math.max(6, Math.round(W / 150));
  const w = SPRITE[0].length * px, h = SPRITE.length * px;
  const wob = Math.sin(t * 0.02) * 2;
  ctx.save();
  ctx.translate(catX - w / 2 + wob, catY - h / 2);
  // свечение
  const g = ctx.createRadialGradient(w / 2, h / 2, 4, w / 2, h / 2, w);
  g.addColorStop(0, 'rgba(255,140,20,.55)');
  g.addColorStop(1, 'rgba(255,60,0,0)');
  ctx.fillStyle = g; ctx.fillRect(-w, -h, w * 3, h * 3);
  const glow = 0.5 + 0.5 * Math.sin(t * 0.01);
  for (let y = 0; y < SPRITE.length; y++) {
    for (let x = 0; x < SPRITE[0].length; x++) {
      const ch = SPRITE[y][x];
      if (ch === '.') continue;
      let col;
      if (ch === 'X') col = `hsl(${18 + glow * 12}, 95%, ${46 + glow * 14}%)`;
      else if (ch === 'W') col = '#fff7d6';
      else col = '#2b0d00';
      ctx.fillStyle = col;
      ctx.fillRect(x * px, y * px, px, px);
    }
  }
  ctx.restore();
}

function frame(t) {
  // пламя-градиент на фоне
  const bg = ctx.createLinearGradient(0, H, 0, 0);
  bg.addColorStop(0, '#2a0600');
  bg.addColorStop(0.45, '#12040a');
  bg.addColorStop(1, '#05020a');
  ctx.globalAlpha = 1; ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  if (!catX) { catX = W / 2; catY = H * 0.62; }

  // топливо: яркие языки пламени у кота и по всей нижней кромке
  for (let i = 0; i < 10; i++) ember(catX + rnd(-60, 60), catY + rnd(-10, 40));
  for (let i = 0; i < 14; i++) ember(rnd(0, W), H + 10 - rnd(0, 30));

  drawCat(t);
  if (Math.random() < 0.35) smoke(catX + rnd(-40, 40), catY - 10);
  if (Math.random() < 0.3) smoke(rnd(0, W), H - 30);

  ctx.globalCompositeOperation = 'lighter';
  // пламя
  for (let i = FUEL.length - 1; i >= 0; i--) {
    const p = FUEL[i];
    p.vx += rnd(-0.12, 0.12);
    p.vy -= 0.035;
    p.vx *= 0.99;
    p.x += p.vx; p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) { FUEL.splice(i, 1); continue; }
    const a = p.life;
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * (1.6 + (1 - a)));
    g.addColorStop(0, `hsla(${45 + a * 15}, 100%, ${70 + a * 20}%, ${0.5 * a})`);
    g.addColorStop(0.5, `hsla(${28 - a * 10}, 100%, 55%, ${0.35 * a})`);
    g.addColorStop(1, 'hsla(12, 100%, 40%, 0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.6 + (1 - a)), 0, 6.283); ctx.fill();
    // искры от пламени
    if (Math.random() < 0.02 * a) {
      EMBERS.push({ x: p.x, y: p.y, vx: rnd(-1, 1), vy: rnd(-4, -1.5), life: 1, decay: rnd(0.005, 0.02), r: rnd(0.8, 2.2), hue: rnd(15, 50) });
    }
  }
  // угли
  for (let i = EMBERS.length - 1; i >= 0; i--) {
    const p = EMBERS[i];
    p.vx += rnd(-0.08, 0.08);
    p.vy -= 0.01;
    p.x += p.vx; p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) { EMBERS.splice(i, 1); continue; }
    const a = Math.max(0, p.life);
    ctx.fillStyle = `hsla(${p.hue}, 100%, ${60 + a * 15}%, ${a})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.5 + a * 0.8), 0, 6.283); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  // дым
  for (let i = SMOKE.length - 1; i >= 0; i--) {
    const s = SMOKE[i];
    s.x += s.vx; s.y += s.vy; s.life -= s.decay; s.rot += 0.01;
    if (s.life <= 0) { SMOKE.splice(i, 1); continue; }
    ctx.globalAlpha = s.life * 0.16;
    ctx.fillStyle = '#3a3330';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (1.6 - s.life), 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (FUEL.length > 2200) FUEL.splice(0, FUEL.length - 2200);
  if (EMBERS.length > 3000) EMBERS.splice(0, EMBERS.length - 3000);
  if (SMOKE.length > 400) SMOKE.splice(0, SMOKE.length - 400);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
